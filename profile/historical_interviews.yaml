knowledge_items:
  - topic: "Async FIFO"
    concept: "Full Condition Gray Code Detection"
    explanation: "FIFO Full occurs when write pointer catches up to synchronized read pointer from behind: MSB and 2nd MSB inverted, lower bits identical (wptr_gray == {~rptr_gray[ADDR_WIDTH:ADDR_WIDTH-1], rptr_gray[ADDR_WIDTH-2:0]})."
    source: "Clifford Cummings Sunburst CDC Paper"
    verified: true

  - topic: "UVM"
    concept: "UVM Factory Registration and Type Override"
    explanation: "`uvm_component_utils(my_driver) registers class with factory. `set_type_override_by_type(original_driver::get_type(), specialized_driver::get_type()) allows dynamic polymorphism without editing base testbench code."
    source: "Accellera UVM 1.2 User Guide"
    verified: true

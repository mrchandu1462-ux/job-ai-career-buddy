  - company: "Qualcomm"
    role: "Design Verification Engineer"
    question: "Explain the difference between uvm_component and uvm_sequence_item in terms of phases, hierarchy, and lifetime."
    topic: "UVM Components"
    category: "technical"
    difficulty: "medium"
    expected_answer: "uvm_component is persistent, rooted in uvm_top, participates in phased execution, and has hierarchical parent-child relationships. uvm_sequence_item is transient, created on-demand, processed through sequencers to drivers, and garbage collected."

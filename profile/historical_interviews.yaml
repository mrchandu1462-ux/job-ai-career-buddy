  - company: "NVIDIA"
    role: "ASIC Verification Engineer"
    question: "What is the difference between shallow copy and deep copy in SystemVerilog classes?"
    topic: "SystemVerilog OOP"
    category: "technical"
    difficulty: "easy"
    expected_answer: "Shallow copy (new obj) copies all variables but only copies handles for nested objects (shared reference). Deep copy creates new instances of nested objects recursively."

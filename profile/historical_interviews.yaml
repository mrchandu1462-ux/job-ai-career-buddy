  - company: "Qualcomm"
    role: "Design Verification Engineer"
    question: "How do you synchronize a multi-bit data bus across asynchronous clock domains safely?"
    topic: "Clock Domain Crossing"
    category: "technical"
    difficulty: "hard"
    expected_answer: "Multi-bit data cannot use simple multi-flop synchronizers due to bus skew and reconvergence. Use an Asynchronous FIFO with Gray-coded pointers, or a handshaking mechanism (REQ/ACK synchronizers with stable data mux)."
    was_correct: false
    source: "Qualcomm Technical Interview 2025"
    source_type: "interview"
    verified: true
    times_asked: 4

  - company: "Texas Instruments"
    role: "ASIC Verification Engineer"
    question: "Why does an Async FIFO require Gray code for write and read pointers instead of standard binary counters?"
    topic: "Async FIFO"
    category: "technical"
    difficulty: "medium"
    expected_answer: "In binary counters, multiple bits can transition simultaneously (e.g. 0111 to 1000 flips 4 bits). Unequal routing delay across clock domains causes synchronizers to capture intermediate glitch values. Gray code changes exactly 1 bit per count, guaranteeing at most 1 cycle of pointer lag without corrupting values."
    was_correct: true
    source: "Texas Instruments Technical 2025"
    source_type: "interview"
    verified: true
    times_asked: 5

  - company: "Texas Instruments"
    role: "ASIC Verification Engineer"
    question: "Explain the 5 independent channels of AXI4 and why VALID/READY handshakes cannot have cyclic dependencies."
    topic: "AXI Protocol"
    category: "technical"
    difficulty: "medium"
    expected_answer: "The 5 channels are AW (Write Address), W (Write Data), B (Write Response), AR (Read Address), and R (Read Data). AXI spec forbids VALID from waiting for READY to prevent deadlocks; READY may wait for VALID."
    was_correct: true
    source: "Texas Instruments Technical 2025"
    source_type: "interview"
    verified: true
    times_asked: 3

  - company: "AMD"
    role: "Design Verification Engineer"
    question: "Write a SystemVerilog concurrent assertion verifying that when grant is asserted, req must have been high on the previous cycle."
    topic: "SystemVerilog Assertions"
    category: "technical"
    difficulty: "medium"
    expected_answer: "property p_grant_req; @(posedge clk) disable iff (!rst_n) grant |-> $past(req, 1); endproperty assert property(p_grant_req);"
    was_correct: true
    source: "AMD Technical Interview 2025"
    source_type: "interview"
    verified: true
    times_asked: 2

  - company: "Synopsys"
    role: "Verification Engineer"
    question: "Explain the difference between `solve x before y` and constraint distribution in SystemVerilog."
    topic: "Constrained Random Verification"
    category: "technical"
    difficulty: "medium"
    expected_answer: "solve...before only changes the probability distribution of solution space without eliminating any legal solutions. It cannot resolve conflicting or contradictory constraints."
